<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A card for you 💌</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,500&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <nav class="nav">
    <a class="brand" href="/">💌 Heartfelt</a>
    <a class="link" href="/">Make your own →</a>
  </nav>
  <main class="card-page" id="root">
    <div class="empty">Loading…</div>
  </main>

  <script src="/themes.js"></script>
  <script>
    const root = document.getElementById('root');
    const id = location.pathname.split('/').pop();

    fetch('/api/cards/' + encodeURIComponent(id))
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(showEnvelope)
      .catch(() => {
        root.innerHTML = `<div class="empty"><h2>Card not found 💔</h2><p>The link may be wrong or the card was deleted.</p><a class="btn" href="/">Make a card</a></div>`;
      });

    function showEnvelope(card) {
      const occ = HF.occasion(card.occasion);
      HF.applyTheme(document.documentElement, occ);
      document.title = `${occ.title}, ${card.to}! ${occ.emoji}`;
      root.innerHTML = `
        <div class="envelope" id="env" role="button" tabindex="0" aria-label="Open your card">
          <div>
            <div class="seal">${occ.emoji}</div>
            <h2 style="margin:0">${HF.esc(card.to)}, you have a card!</h2>
            <p class="muted">${card.from ? 'From ' + HF.esc(card.from) + ' · ' : ''}Tap to open</p>
          </div>
        </div>`;
      const env = document.getElementById('env');
      const open = () => showCard(card, occ);
      env.addEventListener('click', open);
      env.addEventListener('keydown', e => (e.key === 'Enter' || e.key === ' ') && open());
    }

    function showCard(card, occ) {
      const token = (() => { try { return localStorage.getItem('hf-edit-' + card.id); } catch { return null; } })();
      root.innerHTML = `
        <div class="reveal">${HF.renderCard(card)}</div>
        <div class="actions">
          <button class="btn heart-btn" id="heart">❤️ Send love <span id="hc">${card.hearts || 0}</span></button>
          <button class="btn ghost" id="share">Share</button>
          <a class="btn ghost" href="/">Make one back</a>
          ${token ? '<button class="btn ghost" id="del">Delete card</button>' : ''}
        </div>`;
      HF.burst(document.body, occ.particles, 30);
      const v = root.querySelector('.media video');
      if (v) v.play().catch(() => {});

      document.getElementById('heart').addEventListener('click', async () => {
        HF.burst(document.body, ['❤️'], 8);
        const r = await fetch(`/api/cards/${card.id}/heart`, { method: 'POST' });
        if (r.ok) document.getElementById('hc').textContent = (await r.json()).hearts;
      });
      document.getElementById('share').addEventListener('click', async () => {
        if (navigator.share) return navigator.share({ title: document.title, url: location.href }).catch(() => {});
        await navigator.clipboard.writeText(location.href);
        document.getElementById('share').textContent = 'Link copied!';
      });
      const del = document.getElementById('del');
      if (del) del.addEventListener('click', async () => {
        if (!confirm('Delete this card for everyone? This cannot be undone.')) return;
        const r = await fetch('/api/cards/' + card.id, { method: 'DELETE', headers: { 'x-edit-token': token } });
        if (r.ok) { try { localStorage.removeItem('hf-edit-' + card.id); } catch {} location.href = '/'; }
      });
    }
  </script>
</body>
</html>
