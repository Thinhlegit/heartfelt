<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4efe6">
  <title data-i18n-title="create.pageTitle">Heartfelt · write someone a card</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Dancing+Script:wght@600;700&display=swap&subset=vietnamese" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <a class="skip" href="#form" data-i18n="skip">Skip to the form</a>
  <header class="site">
    <a class="brand" href="/">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15"/><path d="M16 23.5s-6.5-4-6.5-9a3.6 3.6 0 0 1 6.5-2.1 3.6 3.6 0 0 1 6.5 2.1c0 5-6.5 9-6.5 9z"/></svg>
      <span>Heartfelt</span>
    </a>
    <nav>
      <a href="/wall"><span class="long" data-i18n="nav.wall">Love wall</span><span class="short" data-i18n="nav.wallShort">Wall</span></a>
      <div class="lang-switch" role="group" aria-label="Language"></div>
    </nav>
  </header>

  <main class="create" id="create">
    <div class="sr-only" id="announce" aria-live="polite"></div>
    <div class="compose">
      <header class="intro">
        <h1 data-i18n="create.heading">Write someone a card.</h1>
        <p data-i18n="create.subtitle"></p>
      </header>

      <form id="form" novalidate>
        <fieldset class="sec">
          <legend data-i18n="sec.names"></legend>
          <div class="row">
            <label class="field"><span data-i18n="create.to"></span><input type="text" name="to" id="to" maxlength="60" autocomplete="off" data-i18n-placeholder="create.toPlaceholder" required></label>
            <label class="field"><span data-i18n="create.from"></span><input type="text" name="from" id="from" maxlength="60" autocomplete="name" data-i18n-placeholder="create.fromPlaceholder"></label>
          </div>
        </fieldset>

        <fieldset class="sec">
          <legend data-i18n="sec.occasion"></legend>
          <div class="chips" id="occChips"></div>
        </fieldset>

        <fieldset class="sec">
          <legend data-i18n="sec.relationship"></legend>
          <div class="chips" id="relChips"></div>
        </fieldset>

        <fieldset class="sec">
          <legend data-i18n="sec.design"></legend>
          <div class="designs" id="designTiles"></div>
        </fieldset>

        <fieldset class="sec">
          <legend><span data-i18n="sec.character"></span> <em data-i18n="create.optional"></em></legend>
          <div class="buddies" id="buddyTiles"></div>
        </fieldset>

        <fieldset class="sec">
          <legend data-i18n="sec.effect"></legend>
          <div class="effect-row">
            <div class="chips" id="effectChips"></div>
            <button type="button" class="text-btn" id="playEffect"></button>
          </div>
        </fieldset>

        <fieldset class="sec">
          <legend data-i18n="sec.message"></legend>
          <textarea name="message" id="message" maxlength="2000" rows="5" data-i18n-placeholder="create.messagePlaceholder"></textarea>
          <div class="under">
            <div class="suggest" id="suggest"></div>
            <span class="count"><span id="count">0</span>/2000</span>
          </div>
        </fieldset>

        <!-- Optional extras stay folded away until someone asks for them -->
        <fieldset class="sec">
          <legend><span data-i18n="sec.extras"></span> <em data-i18n="create.optional"></em></legend>
          <div class="extras" id="extraToggles">
            <button type="button" class="extra-toggle" data-panel="media" aria-expanded="false" aria-controls="panel-media"></button>
            <button type="button" class="extra-toggle" data-panel="voice" aria-expanded="false" aria-controls="panel-voice"></button>
            <button type="button" class="extra-toggle" data-panel="signature" aria-expanded="false" aria-controls="panel-signature"></button>
          </div>

          <div class="extra-panel" id="panel-media" hidden>
            <h3 data-i18n="sec.media"></h3>
            <div class="drop" id="drop" tabindex="0" role="button" data-i18n-aria="create.dropLabel"></div>
            <div class="file-row" id="mediaRow" hidden></div>
            <input type="file" id="mediaInput" accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/webm,video/quicktime" hidden>
          </div>

          <div class="extra-panel" id="panel-voice" hidden>
            <h3 data-i18n="sec.voice"></h3>
            <div class="recorder">
              <button type="button" class="rec-btn" id="recBtn"></button>
              <div class="rec-text">
                <div id="recStatus"></div>
                <div class="meter" id="meter" hidden aria-hidden="true"></div>
                <div class="rec-actions" id="recActions" hidden>
                  <button type="button" class="text-btn" id="rerecord" data-i18n="create.rerecord"></button>
                  <button type="button" class="text-btn" id="removeVoice" data-i18n="create.deleteRec"></button>
                </div>
              </div>
            </div>
            <audio id="recPlayback" controls hidden></audio>
            <label class="text-btn upload-audio"><span data-i18n="create.uploadAudio"></span><input type="file" id="voiceFile" accept="audio/*" hidden></label>
          </div>

          <div class="extra-panel" id="panel-signature" hidden>
            <h3 data-i18n="sec.signature"></h3>
            <div class="sig-pad">
              <canvas id="sigCanvas" role="img" data-i18n-aria="sig.label"></canvas>
              <span class="sig-line" aria-hidden="true"></span>
            </div>
            <div class="sig-foot">
              <span id="sigHint" data-i18n="sig.hint"></span>
              <button type="button" class="text-btn" id="sigClear" data-i18n="sig.clear" hidden></button>
            </div>
          </div>
        </fieldset>

        <fieldset class="sec">
          <legend data-i18n="sec.visibility"></legend>
          <label class="switch-row">
            <span><b data-i18n="vis.public"></b><small id="visHint"></small></span>
            <input type="checkbox" role="switch" id="isPublic">
          </label>
        </fieldset>

        <div class="submit-row">
          <button class="btn primary" id="submit" type="submit" data-i18n="create.submit"></button>
          <div class="error" id="error" role="alert"></div>
          <div class="draft-note" id="draftNote" aria-live="polite"></div>
        </div>
      </form>

      <section class="done" id="done" hidden aria-live="polite">
        <h2 id="doneTitle"></h2>
        <p><span data-i18n="create.doneBody"></span> <span data-i18n="create.doneDelete"></span></p>
        <div class="linkbox">
          <input type="text" id="shareUrl" readonly aria-label="Link">
          <button type="button" class="btn primary" id="copyBtn"></button>
        </div>
        <div class="done-actions">
          <a class="btn" id="openCard" target="_blank"></a>
          <button type="button" class="btn" id="nativeShare" hidden></button>
          <button type="button" class="text-btn" id="another" data-i18n="create.another"></button>
        </div>
      </section>
    </div>

    <aside class="desk" id="desk" aria-label="Preview">
      <div class="desk-inner">
        <div class="desk-head">
          <span data-i18n="create.preview"></span>
          <button type="button" class="text-btn close-preview" id="closePreview"></button>
        </div>
        <div class="desk-card" id="preview"></div>
      </div>
    </aside>

    <button type="button" class="preview-fab" id="openPreview"></button>
  </main>

  <script src="/i18n.js"></script>
  <script src="/themes.js"></script>
  <script src="/create.js"></script>
</body>
</html>
