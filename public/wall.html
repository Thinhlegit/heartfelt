<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4efe6">
  <title data-i18n-title="wall.pageTitle">Love wall · Heartfelt</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Dancing+Script:wght@600;700&display=swap&subset=vietnamese" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site">
    <a class="brand" href="/">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15"/><path d="M16 23.5s-6.5-4-6.5-9a3.6 3.6 0 0 1 6.5-2.1 3.6 3.6 0 0 1 6.5 2.1c0 5-6.5 9-6.5 9z"/></svg>
      <span>Heartfelt</span>
    </a>
    <nav>
      <a href="/" data-i18n="nav.make">Write a card</a>
      <div class="lang-switch" role="group" aria-label="Language"></div>
    </nav>
  </header>
  <main class="wall-page">
    <header class="intro">
      <h1 data-i18n="wall.heading">Love wall</h1>
      <p data-i18n="wall.subtitle"></p>
    </header>
    <div class="tabs" id="filters" role="group"></div>
    <div class="wall" id="wall"></div>
  </main>

  <script src="/i18n.js"></script>
  <script src="/themes.js"></script>
  <script>
    i18n.apply();
    const t = k => i18n.t(k);
    let all = [], filter = 'all', loaded = false;
    const filters = document.getElementById('filters');
    const wall = document.getElementById('wall');

    function drawFilters() {
      // Only offer occasions that actually have cards
      const used = new Set(all.map(c => c.occasion));
      const opts = [{ id: 'all', label: t('wall.all') }, ...HF.occasions.filter(o => used.has(o.id)).map(o => ({ id: o.id, label: HF.occLabel(o.id) }))];
      filters.hidden = opts.length < 3;
      filters.innerHTML = opts.map(o => `<button type="button" data-id="${o.id}" aria-pressed="${o.id === filter}">${HF.esc(o.label)}</button>`).join('');
    }
    filters.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      filter = b.dataset.id;
      filters.querySelectorAll('button').forEach(c => c.setAttribute('aria-pressed', c === b));
      draw();
    });

    function draw() {
      if (!loaded) return;
      const list = filter === 'all' ? all : all.filter(c => c.occasion === filter);
      wall.innerHTML = list.length ? list.map(c => {
        const occ = HF.occasion(c.occasion);
        return `<a href="/c/${encodeURIComponent(c.id)}" style="--a:${occ.a};--b:${occ.b}">${HF.renderCard(c, { compact: true })}</a>`;
      }).join('') : `<div class="empty"><p>${HF.esc(t('wall.empty'))}</p><a class="btn primary" href="/">${HF.esc(t('wall.beFirst'))}</a></div>`;
    }

    i18n.onChange(() => { drawFilters(); draw(); });
    fetch('/api/wall').then(r => r.json()).then(list => { all = list; loaded = true; drawFilters(); draw(); });
  </script>
</body>
</html>
