<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n-title="wall.pageTitle">Love wall 💞</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,500&family=Nunito:wght@400;700;800&display=swap&subset=vietnamese" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <nav class="nav">
    <a class="brand" href="/">💌 Heartfelt</a>
    <div class="nav-links">
      <button type="button" class="lang-toggle"></button>
      <a class="link" href="/" data-i18n="nav.make">Make a card →</a>
    </div>
  </nav>
  <main class="wrap">
    <header class="hero">
      <h1 data-i18n="wall.heading">The Love wall</h1>
      <p data-i18n="wall.subtitle"></p>
    </header>
    <div class="chips" id="filters" style="justify-content:center;margin-top:16px"></div>
    <div class="wall" id="wall"></div>
  </main>

  <script src="/i18n.js"></script>
  <script src="/themes.js"></script>
  <script>
    i18n.apply();
    const t = k => i18n.t(k);
    let all = [], filter = 'all';
    const filters = document.getElementById('filters');
    const wall = document.getElementById('wall');

    function drawFilters() {
      filters.innerHTML = [{ id: 'all', emoji: '💫', label: t('wall.all') }, ...HF.occasions.map(o => ({ ...o, label: HF.occLabel(o.id) }))]
        .map(o => `<button class="chip" data-id="${o.id}" aria-pressed="${o.id === filter}">${o.emoji} ${HF.esc(o.label)}</button>`).join('');
    }
    filters.addEventListener('click', e => {
      const b = e.target.closest('.chip'); if (!b) return;
      filter = b.dataset.id;
      filters.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === b));
      draw();
    });

    function draw() {
      const list = filter === 'all' ? all : all.filter(c => c.occasion === filter);
      wall.innerHTML = list.length ? list.map(c => {
        const occ = HF.occasion(c.occasion);
        return `<a href="/c/${encodeURIComponent(c.id)}" style="--a:${occ.a};--b:${occ.b}">
          ${HF.renderCard(c, { compact: true })}
        </a>`;
      }).join('') : `<div class="empty" style="column-span:all">${HF.esc(t('wall.empty'))} <a href="/">${HF.esc(t('wall.beFirst'))}</a></div>`;
    }

    i18n.onChange(() => { drawFilters(); draw(); });
    drawFilters();
    fetch('/api/wall').then(r => r.json()).then(list => { all = list; draw(); });
  </script>
</body>
</html>
